name: Build Packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布 Tag（留空则只构建不发布）'
        required: false
        default: ''

permissions:
  contents: write

env:
  # luci 上游：提供 luci.mk 与 luci-base host 工具 (po2lmo / jsmin) 的源码
  LUCI_REPO: openwrt/luci
  LUCI_REF: master

jobs:
  # ---------------------------------------------------------------
  # 编译矩阵：同一份源码在不同 SDK 下分别产出 apk / ipk
  #   apk -> ImmortalWrt SNAPSHOT SDK（apk-tools 3.x，gcc-14.4.0）
  #   ipk -> OpenWrt 24.10.5 SDK（opkg / Packages.gz，gcc-13.3.0）
  #
  # chfs 二进制不实时下载：仓库内 chfs/bin/<arch>/chfs 已预置。
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.format }} / ${{ matrix.arch }} / ${{ matrix.sdk_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- apk：ImmortalWrt SNAPSHOT（与 ImmortalWrt 设备一致） ---
          - format: apk
            sdk_name: immortalwrt-snapshot
            sdk_base: https://downloads.immortalwrt.org/snapshots/targets
            sdk_file: immortalwrt-sdk-mediatek-filogic_gcc-14.4.0_musl.Linux-x86_64.tar.zst
            target: mediatek/filogic
            arch: aarch64_cortex-a53
            chfs_bin: arm64

          - format: apk
            sdk_name: immortalwrt-snapshot
            sdk_base: https://downloads.immortalwrt.org/snapshots/targets
            sdk_file: immortalwrt-sdk-x86-64_gcc-14.4.0_musl.Linux-x86_64.tar.zst
            target: x86/64
            arch: x86_64
            chfs_bin: amd64

          # --- ipk：OpenWrt 24.10（稳定版，opkg） ---
          - format: ipk
            sdk_name: openwrt-24.10.5
            sdk_base: https://downloads.openwrt.org/releases/24.10.5/targets
            sdk_file: openwrt-sdk-24.10.5-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            target: mediatek/filogic
            arch: aarch64_cortex-a53
            chfs_bin: arm64

          - format: ipk
            sdk_name: openwrt-24.10.5
            sdk_base: https://downloads.openwrt.org/releases/24.10.5/targets
            sdk_file: openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            target: x86/64
            arch: x86_64
            chfs_bin: amd64

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 rsync unzip zlib1g-dev file wget jq zstd xz-utils

      - name: 校验预置二进制
        run: |
          set -e
          BIN="chfs/bin/${{ matrix.chfs_bin }}/chfs"
          echo "期望路径: $BIN"
          test -s "$BIN" || { echo "::error::缺少预置二进制 $BIN"; ls -R chfs/bin || true; exit 1; }
          echo "大小: $(stat -c%s "$BIN") 字节"
          head -c4 "$BIN" | od -An -tx1 | grep -q '7f 45 4c 46' \
            || { echo "::error::$BIN 不是 ELF 文件"; exit 1; }
          echo "ELF 校验通过"

      - name: 下载并解压 SDK
        run: |
          set -e
          URL="${{ matrix.sdk_base }}/${{ matrix.target }}/${{ matrix.sdk_file }}"
          echo "SDK: $URL"
          wget -q "$URL" -O /tmp/sdk.tar.zst
          test -s /tmp/sdk.tar.zst
          mkdir -p sdk
          tar --use-compress-program=unzstd -xf /tmp/sdk.tar.zst -C sdk --strip-components=1
          echo "--- SDK 顶层 ---"
          ls sdk | head -20
          test -d sdk/staging_dir

      # luci.mk 与 luci-base host 工具 (po2lmo / jsmin) 的源码都来自 luci 仓库。
      # luci-base 的 Host/Compile 会就地用 cc 编译自带 contrib/lemon.c，
      # 再由 lib/plural_formula.y 生成 plural_formula.c/.h，无需外部 lemon。
      - name: 获取 luci feeds
        run: |
          set -e
          mkdir -p luci-src
          for i in 1 2 3; do
            if curl -fsSL --max-time 300 \
                 "https://codeload.github.com/${LUCI_REPO}/tar.gz/refs/heads/${LUCI_REF}" \
                 -o /tmp/luci.tgz && [ -s /tmp/luci.tgz ]; then
              break
            fi
            echo "第 $i 次拉取失败，重试..."
            sleep 5
          done
          test -s /tmp/luci.tgz
          echo "luci tarball: $(stat -c%s /tmp/luci.tgz) 字节"
          tar -xzf /tmp/luci.tgz -C luci-src --strip-components=1
          test -f luci-src/luci.mk
          test -f luci-src/modules/luci-base/src/Makefile
          test -f luci-src/modules/luci-base/src/contrib/lemon.c
          test -f luci-src/modules/luci-base/src/lib/plural_formula.y
          echo "--- luci-base/src ---"
          ls luci-src/modules/luci-base/src

      - name: 放入包源码
        run: |
          set -e
          cd sdk

          # luci-base 的 Makefile 里写死了 `include ../../luci.mk`
          # 以及 `$(CP) ../../NOTICE ../../LICENSE`。
          # 从 package/luci-base/ 出发，../../ 即 SDK 根目录，
          # 因此 luci.mk / NOTICE / LICENSE 必须放在 SDK 根，而不是 feeds/ 下。
          cp ../luci-src/luci.mk  ./luci.mk
          cp ../luci-src/LICENSE  ./LICENSE
          cp ../luci-src/NOTICE   ./NOTICE

          mkdir -p package/luci-base
          cp -r ../luci-src/modules/luci-base/. package/luci-base/

          # chfs：Makefile + extract-bin.sh + 预置二进制 bin/<arch>/chfs
          mkdir -p package/chfs/bin
          cp ../chfs/Makefile         package/chfs/Makefile
          cp ../chfs/extract-bin.sh   package/chfs/extract-bin.sh
          cp -r ../chfs/bin/.         package/chfs/bin/
          chmod +x package/chfs/extract-bin.sh

          # luci-app-chfs：htdocs / po / root / Makefile
          mkdir -p package/luci-app-chfs
          cp -r ../luci-app-chfs/. package/luci-app-chfs/

          echo "--- SDK 根 ---";        ls luci.mk LICENSE NOTICE
          echo "--- luci-base ---";     ls package/luci-base
          echo "--- chfs ---";          ls -R package/chfs | head -20
          echo "--- luci-app-chfs ---"; ls package/luci-app-chfs

      - name: 构建 luci-base host 工具 (po2lmo / jsmin)
        run: |
          set -e
          cd sdk
          make package/luci-base/host/compile V=s -j$(nproc)
          test -x staging_dir/host/bin/po2lmo
          test -x staging_dir/host/bin/jsmin
          echo "po2lmo: $(stat -c%s staging_dir/host/bin/po2lmo) 字节"
          echo "jsmin : $(stat -c%s staging_dir/host/bin/jsmin) 字节"
          ./staging_dir/host/bin/po2lmo 2>&1 | head -3 || true

      - name: 编译 chfs
        run: |
          set -e
          cd sdk
          make package/chfs/compile V=s -j$(nproc)

      - name: 编译 luci-app-chfs
        run: |
          set -e
          cd sdk
          # po2lmo 已由 luci-base host 构建提供；关闭压缩以加快构建并避免
          # 依赖 csstidy / luasrcdiet / ucode/host 等可选 host 工具
          make package/luci-app-chfs/compile V=s -j$(nproc) \
            LUCI_MINIFY_JS=0 LUCI_MINIFY_CSS=0 LUCI_MINIFY_LUA=0 LUCI_MINIFY_UT=0

      - name: 展示失败日志
        if: failure()
        run: |
          cd sdk 2>/dev/null || exit 0
          for f in $(find logs -name '*.txt' 2>/dev/null | head -5); do
            echo "======== $f ========"
            tail -100 "$f"
          done

      - name: 收集产物
        run: |
          set -e
          mkdir -p out
          find sdk/bin/packages -type f \( -name '*chfs*.apk' -o -name '*chfs*.ipk' \) \
            -exec cp -v {} out/ \; || true
          echo "--- 产物 ---"
          ls -la out/
          test "$(ls -A out)" || { echo "::error::没有产出任何包"; exit 1; }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.format }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 发布：仅在打 tag 或手动指定 release_tag 时执行
  # ---------------------------------------------------------------
  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 整理文件
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.apk' -o -name '*.ipk' \) -exec cp -v {} release/ \;
          echo "--- 待发布 ---"
          ls -la release/
          test "$(ls -A release)" || { echo "::error::无可发布文件"; exit 1; }

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
