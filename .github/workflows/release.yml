#
# 内核补发工作流（手动）
#
# 职责: 把仓库内预置的 chfs 二进制补发到指定 tag 的 Release,
#       供路由器端 LuCI 插件「一键下载内核」使用,
#       避免从上游 iscute.cn (HTTP 明文, 证书过期) 获取。
#
# 与 build.yml 的分工:
#   build.yml 在 tag 推送 / 手动发布时已经会把内核二进制一并发布
#   (publish_kernel 默认开启), 并通过 tools/package-release.py 生成覆盖全部
#   资产的 SHA256SUMS。
#
#   本工作流是**补发通道**, 用于以下几种情况:
#     1. 只更新了内核二进制, 不想重跑六架构编译;
#     2. 某次 Release 的内核资产缺失需要补齐;
#     3. build.yml 发布的内核被误删需要找回。
#
#   它只上传两个内核二进制本身, 不再单独上传 SHA256SUMS ——
#   该文件的权威版本由 build.yml 生成(覆盖包 + 内核), 此处覆盖会使其
#   只剩内核条目而丢失包的校验值。
#
# 用法: Actions -> Release Chfs Kernel -> Run workflow, 指定已存在的 tag。
#

name: Release Chfs Kernel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '已存在的 tag, 向其 Release 追加/覆盖内核二进制'
        required: true
        default: 'v1.0.1'

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  release:
    name: 补发 chfs 内核二进制
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 校验预置二进制
        run: |
          set -e

          echo "==== 检出的二进制 ===="
          ls -la chfs/bin/arm64/chfs chfs/bin/amd64/chfs

          # 逐个校验 ELF 魔数与架构号, 防止误提交 Windows 可执行文件或占位文件
          #   e_machine 在 ELF 头偏移 18 字节 (小端 2 字节)
          #   0xB7 = 183 = EM_AARCH64
          #   0x3E =  62 = EM_X86_64
          check_elf() {
            arch_dir="$1"
            want="$2"
            bin="chfs/bin/$arch_dir/chfs"

            test -s "$bin" || { echo "::error::$bin 不存在或为空"; exit 1; }

            magic=$(od -An -tx1 -N4 "$bin" | tr -d ' \n')
            if [ "$magic" != "7f454c46" ]; then
              echo "::error::$bin 不是 ELF 文件 (magic=$magic)"
              exit 1
            fi

            machine=$(od -An -tu1 -j18 -N2 "$bin" | awk '{print $1 + $2 * 256}')
            if [ "$machine" != "$want" ]; then
              echo "::error::$bin 架构不匹配: 期望 e_machine=$want, 实际 $machine"
              exit 1
            fi

            echo "OK  $bin  e_machine=$machine  大小=$(stat -c%s "$bin")"
          }

          check_elf arm64 183
          check_elf amd64 62

      - name: 校验 SHA256SUMS 与二进制一致
        run: |
          set -e

          # SHA256SUMS 为 "<sha256>  <架构目录名>" 两列格式
          fail=0

          while read -r sum name; do
            # 跳过注释与空行: 注释行以 # 开头, 经 read 拆分后 # 落在第一字段 sum 上
            case "$sum" in ''|'#'*) continue ;; esac
            # 仅处理合法 sha256 行 (64 位十六进制)
            case "$sum" in *[!0-9a-fA-F]*) continue ;; esac
            [ "${#sum}" = "64" ] || continue

            bin="chfs/bin/$name/chfs"
            test -f "$bin" || { echo "::error::SHA256SUMS 引用了不存在的 $bin"; fail=1; continue; }

            actual=$(sha256sum "$bin" | cut -d' ' -f1)
            if [ "$actual" = "$sum" ]; then
              echo "OK  $name  $actual"
            else
              echo "::error::$name 校验值不一致"
              echo "        SHA256SUMS: $sum"
              echo "        实际      : $actual"
              fail=1
            fi
          done < chfs/bin/SHA256SUMS

          [ "$fail" = "0" ] || exit 1

      - name: 准备资产
        run: |
          set -e
          mkdir -p dist
          cp chfs/bin/arm64/chfs dist/chfs-linux-arm64-3.1
          cp chfs/bin/amd64/chfs dist/chfs-linux-amd64-3.1
          chmod 0755 dist/chfs-linux-arm64-3.1 dist/chfs-linux-amd64-3.1
          echo "==== 待上传 ===="
          ls -la dist/
          sha256sum dist/*

      - name: 追加到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: dist/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 输出摘要
        run: |
          echo "## 内核补发完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 资产 | 大小 | SHA256 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|--------|" >> $GITHUB_STEP_SUMMARY
          for arch in arm64 amd64; do
            f="dist/chfs-linux-$arch-3.1"
            echo "| \`chfs-linux-$arch-3.1\` | $(stat -c%s "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SHA256SUMS 的权威版本由 build.yml 生成，本工作流不覆盖。" >> $GITHUB_STEP_SUMMARY
