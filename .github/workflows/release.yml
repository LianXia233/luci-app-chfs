#
# 内核发布工作流
#
# 职责: 在推送 v* 形式的 tag 时, 把仓库内预置的 chfs 二进制发布为 Release 资产,
#       使路由器端的 LuCI 插件「一键下载内核」可以从本仓库直接下载内核,
#       而不必再从上游 iscute.cn (HTTP 明文, 证书过期) 获取。
#
# 触发方式:
#   1. 推送 tag:  git tag v3.1 && git push origin v3.1
#   2. 手动触发:  Actions -> Release Chfs Kernel -> Run workflow (可指定 tag)
#
# 产物:
#   chfs-linux-arm64-3.1    (aarch64_cortex-a53 等 64 位 ARM 目标)
#   chfs-linux-amd64-3.1    (x86_64 目标)
#   SHA256SUMS              (两个二进制的校验值)
#
# 命名沿用上游习惯 (chfs-linux-<arch>-<ver>), 便于与上游产物对照。
# 架构精简为 arm64 / amd64 两种, 与 build.yml 的编译矩阵保持一致。
#

name: Release Chfs Kernel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布的 tag (例如 v3.1)'
        required: true
        default: 'v3.1'

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  release:
    name: 发布 chfs 内核二进制
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        # push tag 时检出该 tag; workflow_dispatch 时检出所选分支 (默认 main)。
        # 二进制与 SHA256SUMS 必须来自同一提交, 故不额外指定 ref。

      - name: 校验预置二进制
        run: |
          set -e

          echo "==== 检出的二进制 ===="
          ls -la chfs/bin/arm64/chfs chfs/bin/amd64/chfs

          # 逐个校验 ELF 魔数与架构号, 防止误提交 Windows 可执行文件或占位文件
          #   e_machine 在 ELF 头偏移 18 字节 (小端 2 字节)
          #   0xB7 = 183 = EM_AARCH64
          #   0x3E =  62 = EM_X86_64
          check_elf() {
            arch_dir="$1"
            want="$2"
            bin="chfs/bin/$arch_dir/chfs"

            test -s "$bin" || { echo "::error::$bin 不存在或为空"; exit 1; }

            magic=$(od -An -tx1 -N4 "$bin" | tr -d ' \n')
            if [ "$magic" != "7f454c46" ]; then
              echo "::error::$bin 不是 ELF 文件 (magic=$magic)"
              exit 1
            fi

            machine=$(od -An -tu1 -j18 -N2 "$bin" | awk '{print $1 + $2 * 256}')
            if [ "$machine" != "$want" ]; then
              echo "::error::$bin 架构不匹配: 期望 e_machine=$want, 实际 $machine"
              exit 1
            fi

            echo "OK  $bin  e_machine=$machine  大小=$(stat -c%s "$bin")"
          }

          check_elf arm64 183
          check_elf amd64 62

      - name: 校验 SHA256SUMS 与二进制一致
        run: |
          set -e

          # SHA256SUMS 为 "<sha256>  <架构目录名>" 两列格式
          # 若二进制的实际值与之不符, 说明入库文件被替换而校验文件未同步
          fail=0

          while read -r sum name; do
            # 跳过注释与空行
            case "$name" in ''|'#'*) continue ;; esac

            bin="chfs/bin/$name/chfs"
            test -f "$bin" || { echo "::error::SHA256SUMS 引用了不存在的 $bin"; fail=1; continue; }

            actual=$(sha256sum "$bin" | cut -d' ' -f1)
            if [ "$actual" = "$sum" ]; then
              echo "OK  $name  $actual"
            else
              echo "::error::$name 校验值不一致"
              echo "        SHA256SUMS: $sum"
              echo "        实际      : $actual"
              fail=1
            fi
          done < chfs/bin/SHA256SUMS

          [ "$fail" = "0" ] || exit 1

      - name: 准备发布资产
        run: |
          set -e

          mkdir -p dist

          # 重命名为上游风格, 让下载方一眼看出架构与版本
          cp chfs/bin/arm64/chfs dist/chfs-linux-arm64-3.1
          cp chfs/bin/amd64/chfs dist/chfs-linux-amd64-3.1
          cp chfs/bin/SHA256SUMS dist/SHA256SUMS

          chmod 0755 dist/chfs-linux-arm64-3.1 dist/chfs-linux-amd64-3.1

          echo "==== 发布资产 ===="
          ls -la dist/

          echo "==== 校验值 ===="
          cd dist
          sha256sum chfs-linux-arm64-3.1 chfs-linux-amd64-3.1

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: chfs ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            chfs 文件共享服务器内核二进制。

            ## 资产说明

            | 文件 | 目标架构 | 适用设备 |
            |------|----------|----------|
            | `chfs-linux-arm64-3.1` | aarch64 | aarch64_cortex-a53 等 64 位 ARM 路由 |
            | `chfs-linux-amd64-3.1` | x86_64 | x86_64 软路由 / 虚拟机 |
            | `SHA256SUMS` | — | 校验值清单 |

            ## 安装方式

            **方式一：LuCI 界面一键下载（推荐）**

            服务 → chfs 文件共享 → 内核管理 → 点击「从仓库下载」，
            插件会按当前设备架构自动选择对应二进制并校验 SHA256 后安装。

            **方式二：手动下载安装**

            ```sh
            # 在路由器上执行 (arm64 设备)
            cd /tmp
            wget https://github.com/LianXia233/luci-app-chfs/releases/latest/download/chfs-linux-arm64-3.1
            sha256sum chfs-linux-arm64-3.1
            chmod 0755 chfs-linux-arm64-3.1
            /etc/init.d/chfs stop
            cp /usr/bin/chfs /usr/bin/chfs.bak
            mv chfs-linux-arm64-3.1 /usr/bin/chfs
            /etc/init.d/chfs start
            ```

            ## 说明

            本仓库不编译 chfs 源码，仅重新分发上游发布的预编译二进制。
            二进制来源为 `http://iscute.cn/tar/chfs/3.1/`，上游证书已过期且不提供校验值，
            故此处发布的 SHA256SUMS 为本仓库实测值，作为完整性比对基线。

            路由器端若直连 GitHub 不稳定，可在插件的「下载源」中切换为加速镜像。

      - name: 输出发布摘要
        run: |
          echo "## 内核发布完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 资产 | 大小 | SHA256 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|--------|" >> $GITHUB_STEP_SUMMARY

          for arch in arm64 amd64; do
            f="dist/chfs-linux-$arch-3.1"
            size=$(stat -c%s "$f")
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            echo "| \`chfs-linux-$arch-3.1\` | $size | \`$sum\` |" >> $GITHUB_STEP_SUMMARY
          done
